name: Daily browser refresh

# Sainsbury's, Morrisons and Tesco publish no usable JSON endpoint, so they
# are read with a real browser. Playwright cannot run in a serverless
# function, so this job drives it here and writes to Postgres directly.
on:
  schedule:
    # 03:40 UTC — after the HTTP refresh, and off the hour.
    - cron: '40 3 * * *'
  workflow_dispatch:
    inputs:
      stores:
        description: 'Comma-separated slugs: sainsburys, morrisons, tesco (blank = all)'
        required: false
        default: ''
      terms:
        description: 'How many catalogue terms to cover'
        required: false
        default: '40'

concurrency:
  group: browser-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install the Chromium build Playwright expects
        run: npx playwright install --with-deps chromium

      - name: Refresh
        env:
          DATA_SOURCE: db
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FETCH_CONTACT_URL: ${{ secrets.FETCH_CONTACT_URL }}
          FETCH_DELAY_MS: '1500'
          TERM_LIMIT: ${{ github.event.inputs.terms || '40' }}
        run: npm run refresh:browser -- "${{ github.event.inputs.stores }}"
