name: Refresh prices

# Scrapes, writes the JSON under public/data and commits it. The commit to
# main triggers the deploy workflow, so the site updates itself.
#
# The scheduled run covers ASDA ONLY. Sainsbury's, Morrisons and Tesco answer
# GitHub's runner IP ranges with 403 — their CDNs refuse datacentre traffic.
# Those three are refreshed from a home connection instead; see
# `npm run refresh:local` and the README.
#
# A self-hosted runner would also solve the IP problem, but GitHub advises
# against one on a public repository: a fork's pull request can run arbitrary
# code on it. Not worth it for a price tracker.
on:
  schedule:
    # 03:17 UTC — off the hour, so we are not in the crowd at :00.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      stores:
        description: 'Comma-separated slugs (blank = asda only, which is all that works from CI)'
        required: false
        default: ''
      terms:
        description: 'How many catalogue items to cover'
        required: false
        default: '40'

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install the Chromium build Playwright expects
        run: npx playwright install --with-deps chromium

      - name: Scrape and publish
        env:
          FETCH_CONTACT_URL: ${{ vars.FETCH_CONTACT_URL || 'https://github.com/smtalhadv-web/uk-grocery-price-tool' }}
          # Slower than the local default: a scheduled job has all night (R6).
          FETCH_DELAY_MS: '1500'
          TERM_LIMIT: ${{ github.event.inputs.terms || '40' }}
        # A retailer failing is not the job failing (R7) — the script exits
        # non-zero only when every one of them failed.
        run: npm run refresh:static -- "${{ github.event.inputs.stores || 'asda' }}"

      - name: Commit the new prices
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first, then compare against the index. `git diff` alone
          # reports no change for files git has never seen, and on the first
          # run every file under public/data is untracked — so the very run
          # that creates the dataset would quietly commit nothing.
          git add public/data

          if git diff --cached --quiet -- public/data; then
            echo "No price changes today."
            exit 0
          fi

          git commit -m "data: price refresh $(date -u +%Y-%m-%d)"
          git push
